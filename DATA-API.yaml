# Конфигурация проверок собственного API для заявки на хакатон MAX.
# Перед подачей: проверьте адрес и создайте тестовый ключ для Финансового блока.
# Рабочие секреты не храните в этом файле или Git: передайте их организаторам
# через закрытое поле заявки / служебный слайд презентации.
# Структуру необходимо сверить с формальной схемой платформы оценки, если она выдана.
schema_version: "1"
solution: "MAX Бизнес / Docspace"
base_url: "https://max-213-108-21-198.sslip.io:8443"
openapi: "docs/openapi.yaml"
test_accounts:
  manager:
    role: manager
    auth: "MAX account with signed X-Max-Init-Data; join codes in docs/REVIEWER-ACCESS.md"
  employee:
    role: employee
    auth: "MAX account with signed X-Max-Init-Data; join codes in docs/REVIEWER-ACCESS.md"
  integration:
    role: team-scoped integration
    auth: "Bearer token created by manager; supplied privately"
test_data:
  import_file: "docs/test-data/report-demo.csv"
  channel_id: "demo-fin-cashflow"
  external_id: "hackathon-report-001"
  notes: "Тестовые документы синтетические. Тестовая компания уже размещена; вход по кодам из docs/REVIEWER-ACCESS.md."
checks:
  - id: health
    required: true
    method: GET
    path: /api/health
    role: public
    request: {}
    expected:
      status_codes: [200]
      content_type: application/json
      required_fields: [ok]
      field_values: {ok: true}
  - id: integration_channels
    required: true
    method: GET
    path: /api/integrations/channels
    role: integration
    request:
      headers: {Authorization: "Bearer ${DOCSPACE_TEST_INTEGRATION_TOKEN}"}
    expected:
      status_codes: [200]
      content_type: application/json
      schema: "array<Channel>"
      required_fields_per_item: [id, teamId, name]
  - id: import_report
    required: true
    method: POST
    path: /api/integrations/documents
    role: integration
    request:
      query:
        channelId: demo-fin-cashflow
        title: "Тестовый отчёт хакатона"
        filename: report-demo.csv
        externalId: hackathon-report-001
        review: "1"
      headers:
        Authorization: "Bearer ${DOCSPACE_TEST_INTEGRATION_TOKEN}"
        Content-Type: application/octet-stream
      body_file: docs/test-data/report-demo.csv
    expected:
      status_codes: [201, 200]
      content_type: application/json
      required_fields: [id, channelId, status, sourceSystem, importMethod, externalId, versions]
      field_values:
        status: review
        importMethod: api
        externalId: hackathon-report-001
  - id: report_status
    required: true
    method: GET
    path: /api/integrations/documents
    role: integration
    request:
      query: {externalId: hackathon-report-001}
      headers: {Authorization: "Bearer ${DOCSPACE_TEST_INTEGRATION_TOKEN}"}
    expected:
      status_codes: [200]
      content_type: application/json
      required_fields: [id, status, revision, comments, versions, externalId]
  - id: reject_missing_key
    required: true
    method: GET
    path: /api/integrations/channels
    role: public
    request: {}
    expected:
      status_codes: [401]
      content_type: application/json
      required_fields: [error]
