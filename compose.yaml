services:
  db:
    image: postgres:15-alpine
    container_name: max_business_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-max_business}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Автоматическое выполнение миграций при первом запуске контейнера:
      - ./data/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-max_business}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: max_business_etl
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_password}@db:5432/${POSTGRES_DB:-max_business}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./etl:/app/etl:ro

volumes:
  pgdata:
    driver: local
