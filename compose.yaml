services:
  docspace:
    build: .
    ports:
      - "127.0.0.1:${DOCSPACE_PORT:-8080}:8080"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      LISTEN_ADDR: 0.0.0.0:8080
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_MANAGER_IDS: ${MAX_MANAGER_IDS:-}
      MAX_MEMBER_IDS: ${MAX_MEMBER_IDS:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      MAX_CA_FILE: certs/russian_trusted_root_ca.crt
      BOT_MODE: ${BOT_MODE:-off}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_API_URL: ${MAX_API_URL:-https://platform-api2.max.ru}
    volumes:
      - docspace_data:/app/data
    restart: unless-stopped
  accounting_qa:
    build:
      context: ./services/accounting_qa
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${ACCOUNTING_QA_PORT:-8081}:8081"
    environment:
      DOCSPACE_API_URL: http://docspace:8080
      DOCSPACE_TEST_INTEGRATION_TOKEN: ${DOCSPACE_TEST_INTEGRATION_TOKEN:-}
      ACCOUNTING_QA_PORT: 8081
    depends_on:
      - docspace
    restart: unless-stopped
  reference_db:
    profiles: [reference-data]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${REFERENCE_DB_NAME:-max_business}
      POSTGRES_USER: ${REFERENCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${REFERENCE_DB_PASSWORD:-local-reference-only}
    ports:
      - "127.0.0.1:${REFERENCE_DB_PORT:-5433}:5432"
    volumes:
      - reference_pgdata:/var/lib/postgresql/data
      - ./next/Business-Bot-Max/data/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REFERENCE_DB_USER:-postgres} -d ${REFERENCE_DB_NAME:-max_business}"]
      interval: 5s
      timeout: 5s
      retries: 5
  reference_etl:
    profiles: [reference-data]
    build:
      context: ./next/Business-Bot-Max
      dockerfile: etl/Dockerfile
    environment:
      DATABASE_URL: postgresql://${REFERENCE_DB_USER:-postgres}:${REFERENCE_DB_PASSWORD:-local-reference-only}@reference_db:5432/${REFERENCE_DB_NAME:-max_business}
    depends_on:
      reference_db:
        condition: service_healthy
    volumes:
      - ./next/Business-Bot-Max/data:/app/data:ro
      - ./next/Business-Bot-Max/etl:/app/etl:ro
    restart: "no"
volumes:
  docspace_data:
  reference_pgdata:

